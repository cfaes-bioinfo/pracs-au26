format:
  html:
    css: styles.css
    theme: [cosmo, theme_web.scss]
    highlight-style: atom-one
    toc: true
    number-sections: true
    number-depth: 3
    grid:
      body-width: 850px
    self-contained: true
    include-after-body:
      - partials/page-nav.html
      - partials/code-hl.html # hl-lines="2,4-5" line highlighting

# .file code blocks: copy button, line numbers, default "file" header.
# Runs at pre-ast so the filename it adds is seen by Quarto's own
# filename-header processing.
filters:
  - path: filters/file-code.lua
    at: pre-ast
  # .norun code blocks: wrapper div so long lines scroll (see styles.css)
  - filters/norun.lua

execute:
  freeze: auto
  engine: knitr
  eval: true
editor: source

knitr:
  opts_chunk:
    class-output: regular-r-output
    class-message: regular-r-output
    class-warning: warning-r-output
    class-error: error-r-output
