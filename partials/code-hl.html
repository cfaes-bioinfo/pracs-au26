<script>
(function () {
  // Line highlighting for code blocks on regular (HTML) pages, e.g.
  //   ```{.bash hl-lines="2,4-5"}
  // (Quarto's own code-line-numbers="2,4-5" highlighting only works in
  // revealjs slides). Pandoc passes the attribute through as
  // data-hl-lines on div.sourceCode, and wraps each line in its own
  // <span>; this adds the .hl-line class (styled in styles.css) to the
  // listed lines. Numbers are the displayed line numbers, so with
  // startFrom="12", hl-lines="13" is the block's second line. Wired in via
  // format.html.include-after-body in _quarto.yml.
  document.querySelectorAll("div.sourceCode[data-hl-lines]").forEach(function (div) {
    var lines = div.querySelectorAll("pre > code > span");
    var first = parseInt(div.dataset.startfrom || "1", 10);
    div.dataset.hlLines.split(",").forEach(function (part) {
      var ends = part.trim().split("-").map(Number);
      var from = ends[0];
      var to = ends.length > 1 ? ends[1] : from;
      for (var n = from; n <= to; n++) {
        var line = lines[n - first];
        if (line) line.classList.add("hl-line");
      }
    });
  });

  // Text highlighting, e.g. for placeholders to replace:
  //   ```{.file hl-text="<osc-username>"}
  // Separate several strings with "|": hl-text="<user>|<project>".
  // Each occurrence is wrapped in <span class="hl-text"> (styled in
  // styles.css). Matches are found within single text nodes, so in
  // syntax-highlighted code a string must not span several tokens.
  // The copy button copies textContent, so it is unaffected.
  document.querySelectorAll("div.sourceCode[data-hl-text]").forEach(function (div) {
    var targets = div.dataset.hlText.split("|").filter(Boolean);
    var code = div.querySelector("pre > code");
    if (!code || !targets.length) return;
    var walker = document.createTreeWalker(code, NodeFilter.SHOW_TEXT);
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function (node) {
      var text = node.nodeValue;
      var frag = document.createDocumentFragment();
      var pos = 0;
      var found = false;
      while (true) {
        // Earliest match of any target from pos
        var best = -1, len = 0;
        targets.forEach(function (t) {
          var i = text.indexOf(t, pos);
          if (i !== -1 && (best === -1 || i < best)) { best = i; len = t.length; }
        });
        if (best === -1) break;
        found = true;
        frag.appendChild(document.createTextNode(text.slice(pos, best)));
        var span = document.createElement("span");
        span.className = "hl-text";
        span.textContent = text.slice(best, best + len);
        frag.appendChild(span);
        pos = best + len;
      }
      if (!found) return;
      frag.appendChild(document.createTextNode(text.slice(pos)));
      node.parentNode.replaceChild(frag, node);
    });
  });
})();
</script>
