<section id="$idprefix$title-slide" class="title-slide-custom"$for(title-slide-attributes/pairs)$ $it.key$="$it.value$"$endfor$>
  <div class="title-slide-text">
    <h1 class="title">$title$</h1>
$if(subtitle)$
    <p class="subtitle">$subtitle$</p>
$endif$
$for(author)$
    <p class="author">$author$</p>
$endfor$
$if(date)$
    <p class="date">$date$</p>
$endif$
    <hr class="title-slide-rule">
  </div>
  <div class="title-slide-logos">
    <img src="../img/CFAES-Horiz-RGBHEX.svg" alt="CFAES logo" class="title-slide-logo title-slide-logo-cfaes">
    <img src="../img/logo4.png" alt="PRACS course logo" class="title-slide-logo title-slide-logo-course">
  </div>
</section>
